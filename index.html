
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Convertisseur de données</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(20px, 4vw, 28px);
      margin-bottom: 10px;
      text-align: center;
      color: #38bdf8;
    }

    #compteur {
      margin-bottom: 20px;
      color: #facc15;
      font-weight: 600;
      text-align: center;
    }

    textarea {
      width: 100%;
      max-width: 800px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      resize: vertical;
      min-height: 150px;
      font-size: 14px;
      line-height: 1.6;
      font-family: monospace;
    }

    textarea:focus {
      outline: 2px solid #38bdf8;
      border-color: #38bdf8;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      background: #3b82f6;
      color: white;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2563eb;
    }

    #copyButton {
      background: #facc15;
      color: #0f172a;
      display: none;
    }

    #copyButton:hover {
      background: #eab308;
    }

    .results {
      margin-top: 30px;
      width: 100%;
      max-width: 800px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border-left: 3px solid #38bdf8;
      border-radius: 8px;
      padding: 12px 16px;
      white-space: pre-line;
      font-size: 15px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .instructions {
      max-width: 800px;
      width: 100%;
      margin-bottom: 15px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      color: #4ade80;
    }
  </style>
</head>

<body>

  <h1>Convertisseur de données en blocs</h1>

  <div id="compteur">Aucun bloc généré</div>

  <div class="instructions">
    Collez vos données Excel ou Google Sheets.
    Formats acceptés : 7, 8 ou 9 colonnes.
  </div>

  <textarea
    id="inputData"
    placeholder="Collez ici vos données tabulées..."
  ></textarea>

  <div class="buttons">

    <button type="button" id="generateButton">
      Générer les blocs
    </button>

    <button type="button" id="copyButton">
      Copier tous les blocs
    </button>

  </div>

  <div id="message" aria-live="polite"></div>

  <div class="results" id="results"></div>

  <script>

    let blocsText = "";

    // AJOUT AUTOMATIQUE DU + DEVANT LE TÉLÉPHONE
    function formaterTelephone(numero) {

      numero = numero.trim();

      if (!numero) return "";

      // Éviter les doubles signes +
      if (numero.startsWith("+")) {
        return numero;
      }

      // Ajouter le + devant le numéro
      return "+" + numero;

    }

    // GÉNÉRATION DES BLOCS
    function convertir() {

      const input = document.getElementById("inputData").value;
      const resultsDiv = document.getElementById("results");
      const compteur = document.getElementById("compteur");
      const copyBtn = document.getElementById("copyButton");
      const message = document.getElementById("message");

      resultsDiv.innerHTML = "";
      blocsText = "";
      message.textContent = "";

      let compteurBlocs = 0;
      let lignesIgnorees = 0;

      if (!input.trim()) {

        compteur.textContent = "Aucun bloc généré";
        copyBtn.style.display = "none";

        return;
      }

      const lignes = input.split(/\r?\n/);

      lignes.forEach((ligne) => {

        if (!ligne.trim()) return;

        let parts = ligne.split("\t").map(p => p.trim());

        let noCmd = "";
        let nom = "";
        let tel = "";
        let adresse = "";
        let produit = "";
        let prixUnitaire = "";
        let quantite = "";
        let prixTotal = "";

        // FORMAT 7 COLONNES
        if (parts.length === 7) {

          [
            nom,
            tel,
            adresse,
            produit,
            prixUnitaire,
            quantite,
            prixTotal
          ] = parts;

        }

        // FORMAT 8 COLONNES
        else if (parts.length === 8) {

          [
            noCmd,
            nom,
            tel,
            adresse,
            produit,
            prixUnitaire,
            quantite,
            prixTotal
          ] = parts;

        }

        // FORMAT 9 COLONNES
        else if (parts.length === 9) {

          // Suppression de la colonne vide supplémentaire
          // située entre Adresse et Produit.

          if (parts[4] === "") {

            parts.splice(4, 1);

          } else {

            lignesIgnorees++;
            return;

          }

          [
            noCmd,
            nom,
            tel,
            adresse,
            produit,
            prixUnitaire,
            quantite,
            prixTotal
          ] = parts;

        }

        else {

          lignesIgnorees++;
          return;

        }

        // VÉRIFICATION DES INFORMATIONS ESSENTIELLES
        if (!nom || !tel || !produit || !prixTotal) {

          lignesIgnorees++;
          return;

        }

        // FORMATAGE DU NUMÉRO DE TÉLÉPHONE
        const telephoneFormate = formaterTelephone(tel);

        // QUANTITÉ
        const qte = parseInt(quantite, 10) || 1;

        // AFFICHAGE DU PRODUIT ET DE LA QUANTITÉ
        const produitAffiche = qte > 1
          ? `${produit} x${qte}`
          : produit;

        // CONSTRUCTION DU BLOC
        const blocTexte = [
          noCmd,
          nom,
          telephoneFormate,
          adresse,
          produitAffiche,
          prixTotal
        ].filter((value, index) => {

          // Ne pas afficher la ligne du numéro de commande
          // lorsqu'il est absent.

          return index !== 0 || value !== "";

        }).join("\n");

        // CRÉATION DE LA CARTE
        const card = document.createElement("div");

        card.className = "card";
        card.textContent = blocTexte;

        resultsDiv.appendChild(card);

        // STOCKAGE DES BLOCS POUR LA COPIE
        blocsText += blocTexte + "\n\n";

        compteurBlocs++;

      });

      // MISE À JOUR DU COMPTEUR
      if (compteurBlocs > 0) {

        compteur.textContent =
          `🔢 ${compteurBlocs} bloc${compteurBlocs > 1 ? "s" : ""} généré${compteurBlocs > 1 ? "s" : ""}`;

        if (lignesIgnorees > 0) {

          compteur.textContent +=
            ` | ${lignesIgnorees} ligne(s) ignorée(s)`;

        }

        copyBtn.style.display = "inline-block";

      } else {

        compteur.textContent =
          "Aucun bloc généré. Vérifiez le format des données.";

        copyBtn.style.display = "none";

      }

    }

    // MÉTHODE DE COPIE DE SECOURS
    function copierAvecFallback(texte) {

      const textarea = document.createElement("textarea");

      textarea.value = texte;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";

      textarea.setAttribute("readonly", "");

      document.body.appendChild(textarea);

      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);

      let success = false;

      try {

        success = document.execCommand("copy");

      } catch (error) {

        console.error("Erreur de copie :", error);

      }

      document.body.removeChild(textarea);

      return success;

    }

    // COPIER TOUS LES BLOCS
    async function copierTousLesBlocs() {

      const message = document.getElementById("message");

      if (!blocsText.trim()) {

        message.textContent =
          "❗ Aucun bloc à copier. Générez d'abord les blocs.";

        return;

      }

      const texte = blocsText.trim();

      try {

        if (navigator.clipboard && window.isSecureContext) {

          await navigator.clipboard.writeText(texte);

        } else {

          const success = copierAvecFallback(texte);

          if (!success) {
            throw new Error("Copie impossible");
          }

        }

        message.textContent =
          "✅ Tous les blocs ont été copiés avec succès !";

      } catch (error) {

        const success = copierAvecFallback(texte);

        if (success) {

          message.textContent =
            "✅ Tous les blocs ont été copiés avec succès !";

        } else {

          message.textContent =
            "❌ Échec de la copie. Vérifiez les autorisations du navigateur.";

          console.error(error);

        }

      }

    }

    // ÉVÉNEMENTS DES BOUTONS
    document.getElementById("generateButton")
      .addEventListener("click", convertir);

    document.getElementById("copyButton")
      .addEventListener("click", copierTousLesBlocs);

  </script>

</body>
</html>
